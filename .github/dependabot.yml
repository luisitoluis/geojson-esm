version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    # Agrupa todas las actualizaciones en un solo PR
    groups:
      all-dependencies:
        patterns:
          - "*"
    # Límite de PRs abiertos al mismo tiempo
    open-pull-requests-limit: 5
    # Labels para identificar los PRs fácilmente
    labels:
      - "dependencies"
    # Ignora actualizaciones major que suelen ser breaking changes
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
